
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuaFinder</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #F8F6F1;
      color: #2F3E34;
    }

    header {
      background: #7A9E7E;
      color: white;
      padding: 28px 20px;
      text-align: center;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin-top: 8px;
    }

    main {
      padding: 24px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #5C7C61;
    }

    .categories {
      display: grid;
      gap: 16px;
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #4D6651;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      background: #EDF5ED;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #6E7F73;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>DuaFinder</h1>
  <p>Find the right dua when you need it most.</p>
</header>

<main>

  <h2>Choose a Category</h2>

  <div class="categories">
    <div class="card">🤲 Forgiveness</div>
    <div class="card">👨‍👩‍👧 Parents</div>
    <div class="card">🌿 Anxiety / Peace of Mind</div>
    <div class="card">📚 Success in Studies / Exams</div>
    <div class="card">❤️ Health / Healing</div>
  </div>

</main>

<footer>
  DuaFinder • Your first app prototype
</footer>

</body>
</html>
